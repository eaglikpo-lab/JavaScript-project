<!doctype html>
<html lang="fr">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Calculatrice Interactive</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="calculator" role="application" aria-label="Calculatrice">

        <section class="screen" aria-hidden="false">
            <div class="screen-sub" id="operation">0</div>
            <div class="screen-main" id="display">0</div>
        </section>

        <section class="pad" role="group" aria-label="Clavier de la calculatrice">
            <!-- Row 1 -->
            <button class="btn btn-light" data-action="ac">AC</button>
            <button class="btn btn-light" data-action="c">C</button>
            <button class="btn btn-light" data-action="sign">+/-</button>
            <button class="btn " data-action="percent">%</button>

            <!-- Row 2 -->
            <button class="btn num" data-num="7">7</button>
            <button class="btn num" data-num="8">8</button>
            <button class="btn num" data-num="9">9</button>
            <button class="btn btn-op" data-op="divide">÷</button>

            <!-- Row 3 -->
            <button class="btn num" data-num="4">4</button>
            <button class="btn num" data-num="5">5</button>
            <button class="btn num" data-num="6">6</button>
            <button class="btn btn-op" data-op="multiply">×</button>

            <!-- Row 4 -->
            <button class="btn num" data-num="1">1</button>
            <button class="btn num" data-num="2">2</button>
            <button class="btn num" data-num="3">3</button>
            <button class="btn btn-op" data-op="subtract">−</button>

            <!-- Row 5 -->
            <button class="btn zero num" data-num="0">0</button>
            <button class="btn num" data-num=".">,</button>
            <button class="btn btn-equals" data-action="equals">=</button>
            <button class="btn btn-op" data-op="add">+</button>
        </section>
    </main>

    <!-- <script src="proj.js"></script> -->
    <!--script src="Projet1.js"></script-->
    <script type="module" src="dist/main.js"></script>
</body>

</html>
