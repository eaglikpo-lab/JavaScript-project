<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Gestion des Contacts</title>
    <link rel="stylesheet" href="projet4.css">
</head>

<body>
    <h1>Gestion des Contacts</h1>

    <!-- Formulaire d'ajout -->
    <form id="contact-form">
        <div class="form-group">
            <label>Nom</label>
            <input type="text" id="nom" required>
            <small></small>
        </div>
        <div class="form-group">
            <label>Prénom</label>
            <input type="text" id="prenom" required>
            <small></small>
        </div>
        <div class="form-group">
            <label>Téléphone</label>
            <div id="phone-container">
                <input type="tel" name="telephone[]" required>
            </div>
            <button type="button" id="add-phone">+ Ajouter numéro</button>
        </div>
        <div class="form-group">
            <label>Email</label>
            <div id="email-container">
                <input type="email" name="email[]" required>
            </div>
            <button type="button" id="add-email">+ Ajouter email</button>
        </div>
        <div class="form-group">
            <label>Adresse</label>
            <input type="text" id="adresse">
        </div>
        <div class="form-group">
            <label>Notes</label>
            <textarea id="notes"></textarea>
        </div>
        <button type="submit">Ajouter Contact</button>
    </form>

    <!-- Liste des contacts -->
    <h2>Mes Contacts</h2>
    <ul id="contact-list"></ul>

    <!-- Modal d’édition -->
    <div id="edit-modal" class="modal">
        <div class="modal-content">
            <span id="close-modal">&times;</span>
            <h3>Modifier Contact</h3>
            <form id="edit-form"></form>
        </div>
    </div>

    <script src="projet4.js"></script>
</body>

</html>
