    <!-- PAGE ACCUEIL -->
    <div id="home">
        <h1>Quiz Modulaire</h1>
        <label for="category">Choisir une catégorie :</label>
        <select id="category">
            <option value="culture">Culture générale</option>
            <option value="informatique">Informatique</option>
            <option value="histoire">Histoire</option>
            <option value="api">API</option>
        </select>
        <div id="quiz-message"></div>

        <br><br>

        <!-- Choix du mode -->
        <label for="mode">Mode de jeu :</label>
        <select id="mode">
            <option value="sequentiel">Séquentiel</option>
            <option value="aleatoire">Aléatoire</option>
        </select>
        
        <br><br>
        
        <button id="startBtn">Démarrer le Quiz</button>
        <button id="editorBtn">Éditeur de Quiz</button>

    </div>
    
    <!-- PAGE QUIZ -->
    <div id="quizPage" class="page hidden">
        <h2 id="quizTitle"></h2>
        <div id="quizContainer"></div>
    
        <div id="feedback"></div>

        <div id="progress">
            <div id="timer"></div>
            <div id="lives">Vies: </div>
            <div id="score">Score: </div>
            <!--div id="prog-bar-container"-->
                <div id="progression-bar"></div>
            <!--/div-->

        </div>
    </div>


    <!-- Modal Éditeur -->
    <div id="editorModal" class="modal hidden">
        <div class="modal-content">
            <h2>Éditeur de Quiz / Ajouter une Question</h2>
            <form id="editorForm">

                <label>Catégorie :</label>
                <select id="editorCategory">
                    <option value="culture">Culture</option>
                    <option value="informatique">Informatique</option>
                    <option value="histoire">Histoire</option>
                </select>

                <label>Type:
                    <select id="editorType">
                        <option value="qcm">QCM</option>
                        <option value="vf">Vrai/Faux</option>
                        <option value="text">Texte Libre</option>
                        <option value="drag">Glisser-Déposer</option>
                        <option value="image">Image</option>
                    </select>
                </label>


                <label>Question:
                    <input type="text" id="editorQuestion" required>
                </label>

                <div id="editorOptions">
                    <!-- Pour QCM on ajoute dynamiquement des champs d’options -->
                </div>
                <label>Bonne réponse (index ou vrai/faux) :</label>
                <input type="text" id="editorAnswer" required>

                <button type="submit">Ajouter</button>

                <h3>Aperçu :</h3>
                <div id="preview"></div>

                <button id="backBtn">Retour</button>

                <div class="import-export">
                    <button id="btnExport">Exporter Quiz (JSON)</button>
                    <input type="file" id="inputImport" accept="application/json">
                </div>

                <button type="button" id="closeEditor">Fermer</button>
            </form>
        </div>
    </div>


    <!--script src="projet5.js"></script-->
    <script src="proj5.js"></script>
    <script src="editor.js"></script>
    <script src="data/culture.js"></script>
    <script src="data/informatique.js"></script>
    <script src="data/histoire.js"></script>

</body>

</html>
